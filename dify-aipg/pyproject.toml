[project]
name = "aipg-dify-provider"
version = "0.1.0"
description = "AI Power Grid model provider for Dify"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dify-plugin>=0.9.0,<0.10.0",
    "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.12.0,<0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in production checks that may spend account credit"]

[tool.ruff]
line-length = 100
target-version = "py312"
