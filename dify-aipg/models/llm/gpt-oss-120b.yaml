model: gpt-oss-120b
label:
  en_US: GPT OSS 120B
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 60000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 1024
    min: 1
    max: 32768
pricing:
  input: "0.075"
  output: "0.30"
  unit: "0.000001"
  currency: USD
