name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ai-sdk-aipg/package-lock.json
            n8n-nodes-aipg/package-lock.json
      - name: Root conformance tests
        run: npm test && npm run check && npm run conformance:public
      - name: Vercel AI SDK provider
        working-directory: ai-sdk-aipg
        run: npm ci && npm test && npm run typecheck && npm run lint && npm run build && npm audit --omit=dev
      - name: n8n node
        working-directory: n8n-nodes-aipg
        run: npm ci && npm run lint && npm test && npm audit --omit=dev && npm pack --dry-run
      - name: Open WebUI guide
        working-directory: open-webui-aipg
        run: node scripts/check-public.mjs

  elizaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: elizaos-aipg
        run: bun install --frozen-lockfile && bun run test && bun run typecheck && bun run lint && bun run build

  python-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.24"
      - name: Dify provider
        working-directory: dify-aipg
        run: uv sync --dev --frozen && uv run pytest && uv run ruff check . && uv run ruff format --check .
      - name: LangChain cookbook
        working-directory: langchain-aipg
        run: uv sync --all-groups --frozen && uv run pytest && uv run ruff check . && uv run ruff format --check .
