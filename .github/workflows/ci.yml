name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ai-sdk-aipg/package-lock.json
            n8n-nodes-aipg/package-lock.json
      - name: Root conformance tests
        run: npm test && npm run check && npm run conformance:public
      - name: Vercel AI SDK provider
        working-directory: ai-sdk-aipg
        run: npm ci && npm test && npm run typecheck && npm run lint && npm run build && npm audit --omit=dev && npm pack --dry-run
      - name: Vercel AI SDK packed consumer
        run: npm run test:package:ai-sdk
      - name: n8n node
        working-directory: n8n-nodes-aipg
        run: npm ci && npm run lint && npm test && npm audit --omit=dev && npm pack --dry-run
      - name: Open WebUI guide
        working-directory: open-webui-aipg
        run: node scripts/check-public.mjs

  elizaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - working-directory: elizaos-aipg
        run: bun install --frozen-lockfile && bun run test && bun run typecheck && bun run lint && bun run build && npm pack --dry-run
      - name: ElizaOS packed consumer
        run: npm run test:package:elizaos

  python-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.24"
      - name: Dify provider
        working-directory: dify-aipg
        run: uv sync --dev --frozen && uv run pytest && uv run ruff check . && uv run ruff format --check . && uv run python scripts/check_catalog.py
      - name: LangChain cookbook
        working-directory: langchain-aipg
        run: uv sync --all-groups --frozen && uv run pytest && uv run ruff check . && uv run ruff format --check .
