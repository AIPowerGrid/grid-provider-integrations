[project]
name = "aipg-langchain-cookbook"
version = "0.1.0"
description = "Tested LangChain examples for AI Power Grid text inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "langchain==1.3.18",
  "langchain-openai==1.6.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipg_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in checks that call production and may spend account credit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
